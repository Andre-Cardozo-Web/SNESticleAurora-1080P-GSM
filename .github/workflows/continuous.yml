name: Continuous Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: continuous-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build
        run: make AUTO_INSTALL=yes
      - name: Continuous release
        # AURORA_PICODRIVE_NO_PUBLIC_COMBINED_ELF: licensing safety.
        # CI may build/test PicoDrive but this step must not publish the linked ELF.
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete continuous --cleanup-tag --yes || true
          gh release create continuous build/SNESticle.elf --target "$GITHUB_SHA" --title "Continuous Build" --prerelease --notes "Automatically built from the latest commit on main."
